<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Diagram AS-IS 1 · line art</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; min-height: 100%; background: #ebe8e2; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card { width: min(94vw, calc((100vh - 48px) * 1.65)); aspect-ratio: 1800 / 1090; border-radius: 16px; overflow: hidden; background: #162538;
          box-shadow: 0 0 0 1px rgba(40, 34, 26, .10), 0 18px 50px -18px rgba(40, 34, 26, .35); }
  #as-is-1, #as-is-1 svg { display: block; width: 100%; height: 100%; }
  #as-is-1 svg { user-select: none; touch-action: manipulation; }
</style>
</head>
<body>
  <div class="card"><div id="as-is-1"></div></div>
  <script type="module" src="./js/scene.js"></script>
</body>
</html>
